name: diag-macos

# 只做诊断，不产出东西。
#
# ★ 为什么单独开一个（2026-10-04）
#   用户反馈 mac 版「登录界面正常，点确定后主界面永远不出来、鼠标一直转圈」。
#   我在 Windows 上怎么测都没意义 —— 那是 macOS 特有的路径。
#   而 GitHub 的 macOS runner 是**真 macOS**，之前偏偏测不出来，
#   因为我一直用**英文 locale**，而用户的 Mac 是**中文 locale**。
#
#   这个 workflow 就是去真机上把 locale 这个变量拉出来对比：
#     同一个包/同一份代码，在 C(英文) 和 zh_CN(中文) 下分别是什么表现。

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/diag_macos_fonts.py"
      - "tests/repro_login.py"
      - ".github/workflows/diag-macos.yml"

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.locale }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: C
            apple_cmds: 'defaults write -g AppleLocale -string "en_US" && defaults write -g AppleLanguages -array "en-US"'
          - locale: zh_CN
            apple_cmds: 'defaults write -g AppleLocale -string "zh_CN" && defaults write -g AppleLanguages -array "zh-Hans-CN" "zh-Hans"'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt

      - name: 把系统语言/地区改成 ${{ matrix.locale }}
        # ★ 改不了也无所谓 —— 诊断本身才是重点，别让这一步把 job 挂掉。
        #   （第一版写成 `-array ("en-US")`，括号被当成参数，defaults 直接退出 2。）
        continue-on-error: true
        run: |
          echo "改之前："
          defaults read -g AppleLocale || true
          defaults read -g AppleLanguages || true
          echo '${{ matrix.apple_cmds }}' > /tmp/setlang.sh
          bash /tmp/setlang.sh || echo "（改 locale 失败，继续）"
          echo "改之后："
          defaults read -g AppleLocale || true
          defaults read -g AppleLanguages || true

      - name: "★ 字体层诊断（LC_ALL=${{ matrix.locale }}）"
        env:
          LANG: ${{ matrix.locale }}.UTF-8
          LC_ALL: ${{ matrix.locale }}.UTF-8
          LC_CTYPE: ${{ matrix.locale }}.UTF-8
          XYX_NO_DIALOG: "1"
        run: |
          echo "环境: LC_ALL=$LC_ALL LANG=$LANG"
          python tests/diag_macos_fonts.py
        continue-on-error: true

      - name: "★ 定性：<Configure> → 重绘 是不是无限循环"
        # 真机上抓到主线程卡在 ui/theme.py:559 create_text（由 <Configure> 触发）。
        # 这个实验数 <Configure> 触发次数 —— 暴增=无限循环，次数正常=create_text 本身卡。
        env:
          XYX_NO_DIALOG: "1"
          XYX_HANG_SECONDS: "12"
        run: |
          python tests/diag_canvas_configure.py || true

      - name: "★ 真实驱动一次 login → main（update() 泵事件 + 截图存证）"
        # ★ 不用 mainloop：这台 runner 的 Tcl 定时器不触发，
        #   改成 update() 泵事件（不依赖定时器），并直接截图 ——
        #   这样"点完登录后窗口到底有没有出来"就不再靠猜。
        env:
          LANG: ${{ matrix.locale }}.UTF-8
          LC_ALL: ${{ matrix.locale }}.UTF-8
          LC_CTYPE: ${{ matrix.locale }}.UTF-8
          XYX_NO_DIALOG: "1"
          XYX_HANG_SECONDS: "25"
          XYX_PUMP_SECONDS: "12"
          XYX_SHOT_DIR: "artifacts/screenshots"
        run: |
          python tests/repro_login.py || true

      - name: 上传截图（看主窗口到底出没出来）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-shots-${{ matrix.locale }}
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: 打完收工
        run: echo "诊断结束（结果看上面的日志）"
