name: tests

# 三平台跑全部测试。
# 目的：确认这套代码在 macOS 上没有"只有 Windows 才能过"的隐含假设。
#
# ★ 用例清单不再写在这个文件里：`tests/run_all.py` 自己发现 tests/test_*.py，
#   以前是"新增测试要记得回来改 yml"，很容易漏 → 现在不会再漏。
#   GUI 用例在没有窗口服务器的 runner 上会**自动 SKIP**（见 tests/*.py 的 _require_display），
#   跨平台逻辑由 tests/test_portability.py 兜底。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # ★ 兜底：防止某一步死等把额度烧光（界面探测已在 CI 里自动关闭）
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15          # Apple Silicon
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pyyaml

      - name: 环境自检（tkinter / 数据目录 / Playwright driver）
        run: python main.py selftest
        continue-on-error: true        # 无窗口服务器时"图形会话"会报不可用

      - name: 全部测试（统一 runner：自动发现用例 + 超时 + 落日志）
        env:
          XYX_NO_DIALOG: "1"           # 别让模态窗把 runner 卡住
          XYX_HANG_SECONDS: "20"       # 启动回归的看门狗
          XYX_PUMP_SECONDS: "10"
          XYX_FEATURE_PUMP: "5"
        run: python tests/run_all.py

      - name: 失败时把测试日志贴出来
        if: failure()
        run: |
          echo "::group::每个用例的完整输出"
          for f in artifacts/logs/tests/*.log; do
            echo "---------- $f"
            tail -60 "$f" || true
          done
          echo "::endgroup::"
        shell: bash
        continue-on-error: true
