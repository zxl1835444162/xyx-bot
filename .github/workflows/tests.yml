name: tests

# 三平台跑测试。
# 目的：确认这套代码在 macOS 上没有"只有 Windows 才能过"的隐含假设。
# GUI 测试在没有窗口服务器的 runner 上会**自动 SKIP**（见
# tests/test_gui_pages.py 的 _require_display），跨平台逻辑由
# tests/test_portability.py 兜底。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # ★ 兜底：防止某一步死等把额度烧光（界面探测已在 CI 里自动关闭）
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15          # Apple Silicon；macos-13 已退役、macos-14 正在退役
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pyyaml

      - name: 环境自检（tkinter / 数据目录 / Playwright driver）
        run: python main.py selftest
        continue-on-error: true        # 无窗口服务器时"图形会话"会报不可用

      - name: 纯逻辑测试（不需要窗口）
        shell: bash
        run: |
          set -e
          for t in test_fixes test_waiting test_runplan test_memory test_portability test_font_cache; do
            echo "=============================== $t ==============================="
            python "tests/$t.py"
          done

      - name: GUI 测试（无窗口服务器时会自动 SKIP）
        env:
          XYX_NO_DIALOG: "1"        # 别让模态窗把 runner 卡住
        run: python tests/test_gui_pages.py

      - name: 登录流程测试（登录窗 → 销毁 → 主界面）
        env:
          XYX_NO_DIALOG: "1"
        run: python tests/test_login_flow.py

      - name: ★ 登录 → 主界面 回归（真实事件循环；无窗口会自动 SKIP）
        # 这一条是「点登录后卡死」的守门人：
        # 以前所有 GUI 测试只"构造"窗口、从不跑 mainloop，所以看不见
        # "窗口建好了但事件循环死了"。这个测试跑真实 mainloop，
        # 而且带看门狗 —— 卡住会直接 dump 主线程栈。
        env:
          XYX_NO_DIALOG: "1"
          XYX_HANG_SECONDS: "20"
        run: python tests/repro_login.py
