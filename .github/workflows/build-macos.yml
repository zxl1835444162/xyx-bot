name: build-macos

# 打 macOS 应用（XYXBot.app）并上传产物。
#
# 触发方式：
#   * 手动（Actions 页面点 Run workflow）—— 平时想拿个包就这么用
#   * 发布 Release（published） —— 自动把两个包挂到那个 Release 上
#   * 改动 packaging/** 或 scripts/build_macos.sh 时自动跑一次，确认没打坏
#
# ★ 关于 runner 标签（2026-10 现状）
#   * macos-13        已退役（2025-12）
#   * macos-14        正在退役（2026-10 公告），所以不用
#   * macos-15        Apple Silicon (arm64)  ← 用这个
#   * macos-15-intel  Intel (x86_64)，GitHub 承诺支持到 2027-08 ← 用这个
#   * macos-latest 现在等于 macos-26；用固定标签避免哪天被换掉
#
# ★ PyInstaller **不能跨平台编译**：arm64 的包必须在 arm64 机器上打。
#   所以这里用 matrix，每个架构各自在自己的 runner 上构建。

on:
  workflow_dispatch:
  # ★★ 千万别把 `tags:` 和 `paths:` 写在同一个 push 下面！
  #   GitHub 的过滤条件是**与**关系：那样就变成"既要是 v* 标签、
  #   又要改动 packaging/**"，于是**普通分支推送永远不会触发**（实测踩过）。
  #   所以拆开：分支用 paths 过滤，发布用 release 事件。
  push:
    branches: ["main"]
    paths:
      - "packaging/**"
      - "scripts/build_macos.sh"
      - ".github/workflows/build-macos.yml"
  release:
    types: [published]

permissions:
  contents: write          # 打标签时需要创建 Release

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # ★ 兜底：万一哪一步卡住（比如界面探测在无窗口会话的 runner 上死等），
    #   让它 20 分钟内失败收场，而不是白烧 6 小时额度。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel（支持到 2027-08）
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 确认这个 Python 带 tkinter（GUI 的硬前提）
        run: |
          python -c "import tkinter, sys, platform; print('tk', tkinter.TkVersion, '| py', sys.version.split()[0], '| ', platform.machine())"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install "pyinstaller>=6.6"

      - name: 打包前的纯逻辑测试（跑不过就别打包）
        shell: bash
        run: |
          set -e
          for t in test_fixes test_waiting test_runplan test_memory test_portability test_font_cache test_configure_guard test_startup; do
            echo "=============================== $t ==============================="
            python "tests/$t.py"
          done

      - name: 写入构建信息（方便远程确认"用户装的是哪个版本"）
        shell: bash
        run: |
          python - "$GITHUB_SHA" <<'PY'
          import datetime, pathlib, sys
          sha = (sys.argv[1] or "unknown")[:12]
          pathlib.Path("xyxbot/_buildinfo.py").write_text(
              '"""构建信息（由 CI 自动写入，不要手改）。\n\n'
              'VERSION 以 xyxbot/version.py 为唯一真相源，这里只覆盖 SHA / BUILT_AT。\n"""\n\n'
              'from __future__ import annotations\n\n'
              'from xyxbot.version import VERSION\n\n'
              f'SHA = "{sha}"\n'
              f'BUILT_AT = "{datetime.datetime.utcnow():%Y-%m-%d %H:%M UTC}"\n\n\n'
              'def describe() -> str:\n'
              '    return f"v{VERSION} build={SHA} at={BUILT_AT}"\n',
              encoding="utf-8")
          print(pathlib.Path("xyxbot/_buildinfo.py").read_text(encoding="utf-8"))
          PY

      - name: PyInstaller 打包
        run: pyinstaller --clean --noconfirm packaging/macos/xyxbot.spec

      - name: 校验包结构（可执行 / 图标 / Info.plist / Playwright driver）
        shell: bash
        run: |
          set -e
          APP="dist/XYXBot.app"
          BIN="$APP/Contents/MacOS/XYXBot"
          test -d "$APP" || { echo "✗ 没有产出 $APP"; exit 1; }
          test -x "$BIN" || { echo "✗ $BIN 不可执行"; exit 1; }
          echo "--- file ---"; file "$BIN"
          echo "--- 架构 ---"; lipo -archs "$BIN" || true
          echo "--- 体积 ---"; du -sh "$APP"

          # ① Info.plist 里的中文显示名（验证 info_plist 真的写进去了）
          PLIST="$APP/Contents/Info.plist"
          test -f "$PLIST" || { echo "✗ 没有 Info.plist"; exit 1; }
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" 2>/dev/null || true)"
          test "$NAME" = "星月创作台" || { echo "✗ Info.plist 显示名是 '$NAME'"; exit 1; }
          echo "✓ Info.plist 显示名 = $NAME"

          # ② 应用图标
          ICNS="$(find "$APP" -name '*.icns' -print -quit)"
          test -n "$ICNS" || { echo "✗ 包里没有 .icns 图标"; exit 1; }
          echo "✓ 图标: $ICNS  ($(du -h "$ICNS" | cut -f1))"

          # ③ Playwright driver（没有它连浏览器都起不来）
          #    ★ 注意别去找 src/ ui/ 目录 —— PyInstaller 把纯 Python 模块
          #      打进了 PYZ 归档，磁盘上**没有**这两个目录。
          #      "我们的模块在不在包里"由下一步的 --selftest 实测（它 import 了）。
          DRV="$(find "$APP" \( -name node -o -name 'playwright.sh' \) -print -quit)"
          test -n "$DRV" || { echo "✗ 包里没有 Playwright driver"; exit 1; }
          echo "✓ Playwright driver: $DRV"
          echo "✓ 包结构检查通过"

      - name: 冒烟：跑包内自检（含界面构造，不弹窗所以 runner 上也能跑）
        shell: bash
        env:
          XYX_NO_DIALOG: "1"        # 模态窗会把 runner 卡死
        run: |
          set -e
          BIN="dist/XYXBot.app/Contents/MacOS/XYXBot"
          set +e
          OUT="$("$BIN" --selftest 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          test $RC -eq 0 || { echo "✗ 自检退出码 $RC"; exit 1; }
          # 自检能跑到这里，本身就证明我们的模块（src/ui）确实在包里 ——
          # 它 import 了 src.config / src.selftest / src.session / browser_detector。
          for kw in "核心依赖齐全" "数据可写" "Playwright"; do
            echo "$OUT" | grep -q "$kw" || { echo "✗ 自检输出里缺少「$kw」"; exit 1; }
          done
          # ★★ 界面部分：这一步会真的构造主窗口、构建 9 个页面，
          #    并走一次真实关窗路径。
          #    （默认**不做**窗口显示探测 —— 那要驱动事件循环，在这台没有
          #      真实窗口会话的 runner 上会阻塞；探测放在下一步单独跑。）
          for kw in "主窗口 + 9 个页面全部构建成功" \
                    "关窗通知到了外层"; do
            echo "$OUT" | grep -q "$kw" \
              || { echo "✗ 界面冒烟没通过（缺「$kw」）"; exit 1; }
          done
          echo "✓ 包内自检 + 界面构造冒烟通过"

      - name: 窗口可见性探测（单独跑 + 可移植超时；超时只警告，明确否定则失败）
        # ★ 判据分三种情况，不含糊：
        #   * 报「主窗口已显示」 → 通过
        #   * 报「没有显示出来」 → **失败**（这是真问题的直接证据）
        #   * 超时/没结论       → 这台 runner 驱动不了事件循环，警告并跳过
        #
        # ★★ 2026-10-04 修一个**测试基础设施漏网**：
        #   原来这里写的是 GNU 的 `timeout 120 …`，但 **macOS 没有 `timeout`**
        #   （它是 GNU coreutils，macOS 只自带 BSD 工具；要么 brew install
        #   coreutils 拿 `gtimeout`，要么用别的办法）。GitHub 的 mac runner
        #   上没装，于是这一步**每次都 `timeout: command not found`、退出码
        #   127**，再被下面的 else 分支当成「无结论 → 跳过」——
        #   也就是说：**这条「窗口到底出没出来」的断言自诞生起从未真正执行过**，
        #   一直显示绿色的 success，正是用户那个问题能在 CI 全绿下长期潜伏的原因。
        #   改法：用 **perl** 做超时（macOS 自带 perl，Linux runner 也有），
        #   并且把 rc=127 单独识别出来当**失败**报，杜绝再次静默吞掉。
        continue-on-error: true
        shell: bash
        env:
          XYX_NO_DIALOG: "1"
          XYX_SELFTEST_WINDOW: "1"
        run: |
          set +e
          # 可移植超时：perl 自带 alarm，不依赖 coreutils 的 timeout/gtimeout
          OUT="$(perl -e '
            my $t = 120;
            my $pid = fork();
            if ($pid == 0) {
              setpgrp(0, 0);
              exec @ARGV;
              exit 127;
            }
            $SIG{ALRM} = sub {
              kill("TERM", -$pid);
              sleep 2;
              kill("KILL", -$pid);
              exit 124;
            };
            alarm($t);
            waitpid($pid, 0);
            exit($? >> 8);
          ' ./dist/XYXBot.app/Contents/MacOS/XYXBot --selftest 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          echo "--- 探测退出码 $RC ---"
          if echo "$OUT" | grep -q "主窗口已显示"; then
            echo "✓ 打包版在真 macOS 上：主窗口确实显示出来了"
          elif echo "$OUT" | grep -q "没有显示出来"; then
            echo "✗ 主窗口没有显示出来 —— 这就是用户报的问题"
            exit 1
          elif [ "$RC" = "124" ]; then
            echo "⚠ 窗口探测超时（事件循环在这台 runner 上跑不动），跳过这条断言"
          else
            # ★ 别再让「命令没跑起来」伪装成「跳过」——那是假绿
            echo "✗ 窗口探测没有正常执行（退出码 $RC）"
            exit 1
          fi

      - name: 上传自检截图（窗口到底出没出来，看图）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-shots-${{ matrix.arch }}
          path: |
            ~/Library/Application Support/XYXBot/artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: 压缩（ditto 保留权限与符号链接）
        shell: bash
        run: |
          set -e
          ditto -c -k --keepParent dist/XYXBot.app "dist/XYXBot-macos-${{ matrix.arch }}.zip"
          ls -lh dist/*.zip

      - name: 打 DMG（Mac 上双击就能装的那种）
        # ★ 实测：arm64 runner 上一次过，Intel runner 上偶发失败。
        #   hdiutil 建映像本来就有偶发问题（资源忙/临时空间），
        #   所以这里「重试 3 次 + 失败不阻断构建」——
        #   DMG 只是便利，zip 才是主产物，不能因为它的偶发问题让整次构建红掉。
        #   是否真的产出会在下一步显式检查并打印。
        continue-on-error: true
        shell: bash
        run: |
          # ★ 为什么不只给 zip：.app 里有符号链接和可执行权限，
          #   用 zip 分发时用户必须 `ditto -x -k` 才能正确解压，
          #   直接双击解压有概率丢权限。DMG 是磁盘映像，天然保留一切，
          #   而且双击挂载 → 拖进「应用程序」就是 Mac 的标准安装动作。
          #   卷名用 ASCII，避免 CI shell 的编码问题。
          DMG="dist/XYXBot-macos-${{ matrix.arch }}.dmg"
          for i in 1 2 3; do
            echo "--- hdiutil 第 $i 次尝试 ---"
            rm -f "$DMG"
            if hdiutil create -volname "XYXBot" \
                 -srcfolder dist/XYXBot.app -ov -format UDZO "$DMG"; then
              echo "✓ DMG 创建成功"
              ls -lh "$DMG"
              hdiutil imageinfo "$DMG" | head -15
              exit 0
            fi
            echo "第 $i 次失败，等 5 秒重试…"
            sleep 5
          done
          echo "⚠ DMG 三次都没成功 —— 只上传 zip，构建继续"
          exit 0

      - name: 汇总产物
        shell: bash
        run: |
          echo "=== dist/ ==="
          ls -lh dist/ || true
          test -f "dist/XYXBot-macos-${{ matrix.arch }}.zip" \
            || { echo "✗ 连 zip 都没有"; exit 1; }
          if [ -f "dist/XYXBot-macos-${{ matrix.arch }}.dmg" ]; then
            echo "✓ 有 DMG"
          else
            echo "⚠ 这次没有 DMG（见上一步日志），zip 仍然可用"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: XYXBot-macos-${{ matrix.arch }}
          # ★ dmg（推荐，双击安装）+ zip（存档/兼容）
          #   dmg 偶发缺失时不至于让上传报错（上面已显式检查过）
          path: |
            dist/XYXBot-macos-${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 30

      - name: 发布时挂到 Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            "dist/XYXBot-macos-${{ matrix.arch }}.dmg" \
            "dist/XYXBot-macos-${{ matrix.arch }}.zip" --clobber
